[package]
name = "cuaca"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Pure-logic core of the cuaca weather toolchain: typed BMKG forecast models, Waybar and terminal rendering, weather icons, localization, and forecast statistics"
repository = "https://github.com/rafiyq/cuaca-rs"
homepage = "https://github.com/rafiyq/cuaca-rs"
readme = "README.md"
keywords = ["weather", "bmkg", "waybar", "indonesia", "forecast"]
categories = ["data-structures", "text-processing", "localization"]
rust-version = "1.74"

[dependencies]
chrono = { version = "0.4.38", features = ["unstable-locales", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serial_test = "3"
